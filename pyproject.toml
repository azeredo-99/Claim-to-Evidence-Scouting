[project]
name = "claim-to-evidence-scouting"
version = "0.1.0"
description = "Test the claims of a qualitative scouting report against league data and own video coding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "mplsoccer>=1.4",
    "pandas>=2.2",
    "pandera>=0.24",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
c2e = "c2e.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2e"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic characters (×, −, –) are intentional in report text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mplsoccer.*", "pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
